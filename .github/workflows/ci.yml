name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint informatif : la dette restante concerne des règles react-hooks
      # strictes (set-state-in-effect) sur le motif de chargement de données
      # utilisé dans toute l'application. Le build et les tests restent
      # les barrières bloquantes.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build
